[project]
name = "citibike-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tom0809", email = "uyssstom@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.94",
    "cryptography==46.0.3",
    "dbt-databricks>=1.12.5",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[project.scripts]
citibike-data-platform = "citibike_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
