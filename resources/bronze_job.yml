resources:
  jobs:
    citibike_pipeline_job:
      name: citibike-data-pipeline-dev

      tasks:
        - task_key: bronze_station_status
          spark_python_task:
            python_file: ../src/citibike_data_platform/bronze/station_status.py
          environment_key: default
        - task_key: bronze_station_information
          spark_python_task:
            python_file: ../src/citibike_data_platform/bronze/station_information.py
          environment_key: default
        - task_key: silver_stations
          depends_on:
            - task_key: bronze_station_status
            - task_key: bronze_station_information
          spark_python_task:
            python_file: ../src/citibike_data_platform/silver/stations.py
          environment_key: default
        - task_key: bronze_trips
          spark_python_task:
            python_file: ../src/citibike_data_platform/bronze/trips.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"