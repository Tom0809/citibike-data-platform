resources:
  jobs:
    citibike_historical_pipeline_job:

      # ====================================================
      # Job name
      # ====================================================
      #
      # dev  -> citibike-historical-pipeline-dev
      # prod -> citibike-historical-pipeline-prod
      #
      name: citibike-historical-pipeline-${bundle.target}


      # ====================================================
      # Job-level operational settings
      # ====================================================

      # Do not allow overlapping historical pipeline runs
      max_concurrent_runs: 1


      # Historical trip data is monthly.
      #
      # Keep paused for now because monthly ingestion into S3
      # is not automated yet.
      schedule:
        quartz_cron_expression: "0 0 6 5 * ?"
        timezone_id: UTC
        pause_status: PAUSED


      # ====================================================
      # Optional notifications
      # ====================================================
      #
      # email_notifications:
      #   on_failure:
      #     - your_email@example.com
      #
      # notification_settings:
      #   no_alert_for_skipped_runs: true
      #   no_alert_for_canceled_runs: true


      # ====================================================
      # Tasks
      # ====================================================

      tasks:

        # ====================================================
        # 1. Bronze - Historical trips
        # ====================================================
        - task_key: bronze_trips

          spark_python_task:
            python_file: ../src/citibike_data_platform/bronze/trips.py

            # Pass environment-specific catalog to Python
            #
            # dev:
            #   --catalog citibike_dev
            #
            # prod:
            #   --catalog citibike_prod
            #
            parameters:
              - "--catalog"
              - "${var.catalog}"

          environment_key: default

          # Transient storage / compute failures can be retried
          max_retries: 2
          min_retry_interval_millis: 600000

          # Historical files are much larger than live snapshots
          timeout_seconds: 3600
          retry_on_timeout: true


        # ====================================================
        # 2. Silver - Clean historical trips
        # ====================================================
        - task_key: silver_trips

          depends_on:
            - task_key: bronze_trips

          spark_python_task:
            python_file: ../src/citibike_data_platform/silver/clean_trips.py

            parameters:
              - "--catalog"
              - "${var.catalog}"

          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 600000

          # Allow up to 2 hours for large monthly increments
          timeout_seconds: 7200
          retry_on_timeout: true


        # ====================================================
        # 3. Gold - Historical analytics
        # ====================================================
        - task_key: dbt_historical_gold

          depends_on:
            - task_key: silver_trips

          dbt_task:
            source: WORKSPACE

            project_directory: ${workspace.file_path}/citibike_dbt

            commands:
              - "dbt build --select hourly_trip_demand +station_monthly_flow"

            warehouse_id: e282982f1c77a797

            # Automatically resolved from databricks.yml:
            #
            # dev  -> citibike_dev
            # prod -> citibike_prod
            catalog: ${var.catalog}

            schema: gold

          environment_key: dbt

          # dbt can retry once for transient warehouse issues
          max_retries: 1
          min_retry_interval_millis: 600000

          timeout_seconds: 3600
          retry_on_timeout: true


      # ====================================================
      # Serverless environments
      # ====================================================

      environments:

        # Python / PySpark tasks
        - environment_key: default
          spec:
            environment_version: "2"


        # dbt task
        - environment_key: dbt
          spec:
            environment_version: "2"

            dependencies:
              - dbt-databricks==1.12.5