resources:
  jobs:
    citibike_historical_pipeline_job:
      name: citibike-historical-pipeline-dev

      tasks:
        # ====================================================
        # Bronze - Historical trips
        # ====================================================
        - task_key: bronze_trips
          spark_python_task:
            python_file: ../src/citibike_data_platform/bronze/trips.py
          environment_key: default

        # ====================================================
        # Silver - Clean historical trips
        # ====================================================
        - task_key: silver_trips
          depends_on:
            - task_key: bronze_trips

          spark_python_task:
            python_file: ../src/citibike_data_platform/silver/clean_trips.py

          environment_key: default

        # ====================================================
        # Gold - Historical analytics
        # ====================================================
        - task_key: dbt_historical_gold
          depends_on:
            - task_key: silver_trips

          dbt_task:
            source: WORKSPACE
            project_directory: ${workspace.file_path}/citibike_dbt

            commands:
              - "dbt build --select hourly_trip_demand +station_monthly_flow"

            warehouse_id: e282982f1c77a797
            catalog: citibike_dev
            schema: gold

          environment_key: dbt

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

        - environment_key: dbt
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks==1.12.5