version: 2

models:
  - name: hourly_trip_demand
    description: >
      Hourly Citi Bike trip demand aggregated by date,
      rider type, and bike type for historical demand analysis.

    columns:
      - name: ride_date
        description: Calendar date when the trip started.
        data_tests:
          - not_null

      - name: ride_hour
        description: Hour of day from 0 to 23 when the trip started.
        data_tests:
          - not_null

      - name: member_casual
        description: Rider membership segment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['member', 'casual']

      - name: rideable_type
        description: Type of bicycle used for the trip.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['electric_bike', 'classic_bike']

      - name: total_trips
        description: Number of trips in the hourly segment.
        data_tests:
          - not_null

      - name: avg_ride_duration_minutes
        description: Average ride duration in minutes for the segment.
        data_tests:
          - not_null

  - name: station_monthly_flow
    description: >
      Monthly station-level trip flow metrics showing departures,
      arrivals, total station activity, and net bike flow.

    columns:
      - name: station_month_key
        description: Unique identifier for a station within a year and month.
        data_tests:
          - not_null
          - unique

      - name: ride_year
        data_tests:
          - not_null

      - name: ride_month
        data_tests:
          - not_null

      - name: station_key
        description: Canonical station identifier used for analytical aggregation historical station IDs may be mapped to a shared canonical key.
        data_tests:
          - not_null

      - name: departures
        description: Number of trips starting from the station during the month.
        data_tests:
          - not_null

      - name: arrivals
        description: Number of trips ending at the station during the month.
        data_tests:
          - not_null

      - name: total_station_activity
        description: Total departures plus arrivals for the station.
        data_tests:
          - not_null

      - name: net_flow
        description: >
          Arrivals minus departures. Positive values indicate net inflow,
          while negative values indicate net outflow.
        data_tests:
          - not_null

  - name: station_live_health
    description: >
      Current Citi Bike station service health based on bike availability,
      dock availability, disabled assets, and operating status.

    columns:
      - name: station_id
        description: Unique station identifier.
        data_tests:
          - not_null
          - unique

      - name: health_status
        description: Current operational health classification of the station.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - HEALTHY
                  - LOW_BIKES
                  - LOW_DOCKS
                  - NO_BIKES
                  - NO_DOCKS
                  - OUT_OF_SERVICE

      - name: num_bikes_available
        data_tests:
          - not_null

      - name: num_docks_available
        data_tests:
          - not_null

  - name: station_rebalancing_priority
    description: >
      Actionable station-level priority queue for Citi Bike operations,
      identifying stations requiring bike rebalancing or investigation
      based on current service availability.

    columns:
      - name: priority_rank
        description: Operational priority ranking, where 1 is the highest priority.
        data_tests:
          - not_null
          - unique

      - name: station_id
        data_tests:
          - not_null
          - unique

      - name: health_status
        data_tests:
          - not_null

      - name: priority_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CRITICAL
                  - HIGH
                  - MEDIUM

      - name: recommended_action
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ADD_BIKES
                  - REMOVE_BIKES
                  - INVESTIGATE

      - name: priority_score
        data_tests:
          - not_null